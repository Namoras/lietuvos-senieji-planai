tika.lt/content/108080"]], "yr": 2015, "pf": 1700, "pt": 1900, "per": "1700–1900"}, {"t": "Subačiaus vartai ir sienos atkarpa", "ll": [54.6758, 25.2925], "d": "Siena restauruota 1961 m.", "img": "subaciaus.jpg", "cap": "Siena prie Subačiaus vartų, XVIII a. pab. piešinys (vieša nuosavybė)", "capu": "https://commons.wikimedia.org/wiki/File:Defensive_wall_near_Suba%C4%8Dius_gate.Vilnius.Lithuania.jpg", "txt": "Prie Strazdelio ir Subačiaus g. sankryžos išliko apie 30 m sienos su 4 šaudymo lizdais ir 10 angų. Nuo čia siena tęsiasi Bokšto gatve.", "src": [["VLE: Vilniaus miesto siena", "https://www.vle.lt/straipsnis/vilniaus-miesto-siena/"]], "yr": 1961, "pf": 1503, "pt": 2026, "per": "1503–dabar"}, {"t": "Sienos atkarpa Šv. Dvasios ir Bazilijonų g.", "ll": [54.6747, 25.288], "d": "Išlikusi, apie 215 m", "img": "siena.jpg", "cap": "Vilniaus miesto sienos fragmentas. Foto: Rimantas Lazdynas, CC BY-SA 3.0 (tiksli vieta nuotraukoje nenurodyta)", "capu": "https://commons.wikimedia.org/wiki/File:Vilniaussiena.JPG", "txt": "Ilgiausia išlikusi sienos atkarpa, dabar sudaranti Šv. Dvasios cerkvės komplekso dalį. Vieta apytikslė.", "src": [["VLE: Vilniaus miesto siena", "https://www.vle.lt/straipsnis/vilniaus-miesto-siena/"]], "yr": null, "pf": 1503, "pt": 2026, "per": "1503–dabar"}, {"t": "Pylimo g. sienos atkarpa", "ll": [54.6748, 25.2846], "d": "Restauruota 1959 m.", "img": null, "txt": "Apie 40 m išlikusios sienos su šaudymo lizdais ir prakasa, rodančia požeminę dalį. Vieta apytikslė.", "src": [["VLE: Vilniaus miesto siena", "https://www.vle.lt/straipsnis/vilniaus-miesto-siena/"]], "yr": 1959, "pf": 1503, "pt": 2026, "per": "1503–dabar"}, {"t": "Žemutinė pilis ir Valdovų rūmai", "ll": [54.68585, 25.28896], "d": "1988 m. – dabar", "img": "palace.jpg", "cap": "Kasinėjimų metu atidengti pamatai Valdovų rūmų muziejuje. Foto: Hayden Soloviev, CC BY 4.0", "capu": "https://commons.wikimedia.org/w/index.php?search=Archaeological+excavations+and+preserved+foundations+Palace+of+the+Grand
