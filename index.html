const map=L.map('map').fitBounds(D.m[0].b);

const ML=D.m.map(m=>L.imageOverlay(m.u,m.b,{opacity:.9,attribution:m.n}));
const ms=document.getElementById('ms');
let cur=null;
function setMap(){const y=+ms.value;document.getElementById('my').textContent=y;let k=-1;D.m.forEach((m,i)=>{if(m.y<=y)k=i});
 if(cur){map.removeLayer(cur);cur=null}
 if(k<0){document.getElementById('mn').textContent='Senesnio plano nėra';return}
 const m=D.m[k]; cur=ML[k].addTo(map); cur.setOpacity(document.getElementById('op').value/100); document.getElementById('mn').textContent=m.y+' m. '+m.n}
ms.oninput=()=>{setMap();setFinds()}; document.getElementById('op').oninput=e=>cur&&cur.setOpacity(e.target.value/100); setMap();

const fm=D.f.map(f=>{const img=f.img?`img/${f.img}`:f.web_img;

 return {f,mk}});
const finds=L.layerGroup().addTo(map);

setFinds();
